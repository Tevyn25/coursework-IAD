<h1>In order to browse and choose products, please login below, or sign up to create an account</h1>
<form action="sign up.html" target="_blank">
    <button type="submit">Click here to create an account</button>
    </form>
    <form class="row g-3">
      <div class="mb-3 mt-3">
        <label for="userfirstname" class="form-label">First name</label>
        <input type="text" class="form-control" id="validationDefault01" value="" required>

        <label for="userlastname" class="form-label">Last name</label>
        <input type="text" class="form-control" id="validationDefault02" value="" required>
      
  
        <label for="useremail" class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"></span>
          <input type="email" class="form-control" id="validationDefaultUsername" placeholder="You "value=""required>
  
      </div>

        <label for="userpassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="validationDefault03" placeholder="Your password will be hidden" required>

        <label for="userconfirmpassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="validationDefault03" placeholder="To make sure you typed your password correctly, please re-enter here" required>
  
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
          <label class="form-check-label" for="invalidCheck2">
            Agree to terms and conditions
          </label>
        </div>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Press to Login</button>
      </div>
    </form>
