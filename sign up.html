      <br>
      <h2>Don't have an account? Sign up here to have full access and put things in your basket</h2>

      <form class="row g-3">
        <div class="mb-3 mt-3">
          <label for="validationDefault01" class="form-label">Enter your first name</label>
          <input type="text" class="form-control" id="validationDefault01" value="" required>

          <label for="validationDefault02" class="form-label">Enter your Last name</label>
          <input type="text" class="form-control" id="validationDefault02" value="" required>
        
    
          <label for="validationDefault03" class="form-label">Enter your Email Address</label>
          <div class="input-group">
            <span class="input-group-text" id="inputGroupPrepend2"></span>
            <input type="email" class="form-control" id="validationDefault03"  aria-describedby="inputGroupPrepend2" required>
    
          </div>

          <label for="validationDefault04" class="form-label">Create a password</label>
          <input type="password" class="form-control" id="validationDefault04" required>

          <label for="validationDefault05" class="form-label">Please enter your age</label>
          <input type="age" class="form-control" id="validationDefault05" required>
    
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
            <label class="form-check-label" for="invalidCheck2">
              Agree to terms and conditions
            </label>
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Press to create your account</button>
        </div>
      </form>
